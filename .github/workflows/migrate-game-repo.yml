name: Oyunu ayrı depoya taşı

# Bu workflow `game-standalone` dalını (mod menüsünden arındırılmış, oyun kök
# dizinde, 14 commit'lik geçmişiyle) ayrı bir depoya `main` olarak gönderir.
#
# Telefondan çalıştırılabilir — bilgisayar gerekmez.
#
# ÖN KOŞUL: tek bir secret eklemen gerekiyor. Adımlar en altta.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Hedef depo (kullanıcı/depo)'
        required: true
        default: 'FEW1N1337/dreamcar-game'
      target_branch:
        description: 'Hedef dal'
        required: true
        default: 'main'
      force:
        description: 'Hedef dal doluysa üzerine yaz (dikkat: veri kaybı)'
        type: boolean
        default: false

jobs:
  migrate:
    name: game-standalone → hedef depo
    runs-on: ubuntu-latest
    steps:
      - name: Secret kontrolü
        env:
          TOKEN: ${{ secrets.GAME_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GAME_REPO_TOKEN secret'ı tanımlı değil."
            echo "Nasıl ekleneceği bu workflow dosyasının altındaki yorumda yazıyor."
            exit 1
          fi
          echo "Secret bulundu."

      # game-standalone dalının tam geçmişi lazım — sığ klon işe yaramaz.
      - name: game-standalone dalını çek
        uses: actions/checkout@v4
        with:
          ref: game-standalone
          fetch-depth: 0

      - name: Taşınacak içeriği göster
        run: |
          {
            echo "### Taşınacak içerik"
            echo ""
            echo "**Kaynak:** \`game-standalone\` (bu depo)"
            echo "**Hedef:** \`${{ inputs.target_repo }}\` dal \`${{ inputs.target_branch }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit sayısı | $(git rev-list --count HEAD) |"
            echo "| Dosya sayısı | $(git ls-files | wc -l) |"
            echo "| C# script | $(git ls-files '*.cs' | wc -l) |"
            echo ""
            echo "**Kök dizin:**"
            echo '```'
            git ls-tree --name-only HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Mod menüsünün kazara sızmadığını doğrula — bu taşımanın bütün amacı.
      - name: Mod menüsü sızıntı kontrolü
        run: |
          if git ls-files | grep -qiE 'Tweak\.xm|template/'; then
            echo "::error::Mod menüsü dosyaları bulundu — taşıma durduruldu."
            git ls-files | grep -iE 'Tweak\.xm|template/'
            exit 1
          fi
          echo "Temiz: mod menüsüne ait dosya yok."

      # game-standalone saf bir `git subtree split` çıktısıdır: oyun kök dizinde,
      # .github klasörü yok. CI dosyalarını burada üretiyoruz ki dal her yeniden
      # bölündüğünde elle bakım gerekmesin. Yollar kök dizine göre düzeltilir
      # (UnityGame/ öneki yeni depoda yok).
      - name: CI workflow'larını hazırla
        env:
          SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # actions/checkout dar bir refspec kuruyor, bu yüzden "git fetch origin main"
          # uzak izleme referansını (origin/main) güncellemeyebiliyor. FETCH_HEAD her
          # zaman az önce çekilen commit'i gösterir — ona bakıyoruz.
          git fetch origin "$SOURCE_BRANCH" --depth=1
          mkdir -p .github/workflows

          # Önce hepsinin var olduğunu doğrula. Doğrudan "git show > dosya" yazsaydık
          # kabuk yönlendirmeyi git çalışmadan önce yapar, dosya eksikse geriye boş
          # dosya kalır ve hata mesajı ham git fatal'ı olur.
          copy_from_source() {
            src="$1"; dst="$2"
            if ! git cat-file -e "FETCH_HEAD:${src}" 2>/dev/null; then
              echo "::error::'${src}' dosyası '${SOURCE_BRANCH}' dalında yok."
              echo "Unity CI dosyaları varsayılan dalda bulunmalı; feature dalında"
              echo "kalmışlarsa önce oraya taşı."
              exit 1
            fi
            git show "FETCH_HEAD:${src}" > "$dst"
          }

          for f in unity-android-build.yml unity-ios-build.yml CI_SETUP.md; do
            copy_from_source ".github/workflows/${f}" ".github/workflows/${f}"
          done
          copy_from_source ".github/exportOptions.plist" ".github/exportOptions.plist"

          # 'UnityGame' → '.' : proje artık kökte
          sed -i \
            -e "s|UNITY_PROJECT_PATH: UnityGame|UNITY_PROJECT_PATH: .|" \
            -e "s|'UnityGame/\*\*'|'Assets/**'|" \
            .github/workflows/unity-android-build.yml \
            .github/workflows/unity-ios-build.yml

          if grep -rn "UnityGame" .github/workflows/*.yml; then
            echo "::error::CI dosyalarında düzeltilmemiş UnityGame yolu kaldı."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github
          git commit -m "CI: workflow yolları kök dizine göre ayarlandı" \
            || echo "Değişiklik yok, commit atlandı."

      - name: Hedef depoya gönder
        env:
          TOKEN: ${{ secrets.GAME_REPO_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # Token URL'de görünmesin diye kimlik bilgisi header üzerinden verilir.
          git remote add target "https://github.com/${TARGET_REPO}.git"
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)

          PUSH_ARGS=""
          if [ "$FORCE" = "true" ]; then
            PUSH_ARGS="--force"
            echo "::warning::Force push açık — hedef daldaki mevcut geçmiş silinecek."
          fi

          git -c "http.https://github.com/.extraheader=Authorization: Basic ${AUTH}" \
              push $PUSH_ARGS target "HEAD:refs/heads/${TARGET_BRANCH}"

          echo "Gönderildi."

      - name: Sonuç
        run: |
          {
            echo ""
            echo "### Taşıma tamamlandı"
            echo ""
            echo "👉 https://github.com/${{ inputs.target_repo }}"
            echo ""
            echo "Yeni depoda yapılacaklar:"
            echo "1. Settings → Secrets → \`UNITY_LICENSE\` ekle"
            echo "2. Settings → Variables → \`UNITY_CI_ENABLED\` = \`true\`"
            echo "3. Actions → Unity Android Build → Run workflow → APK indir"
          } >> "$GITHUB_STEP_SUMMARY"

# ============================================================================
# SECRET NASIL EKLENİR (telefondan yapılabilir)
# ============================================================================
#
# 1) Token oluştur
#    github.com → sağ üst profil → Settings → en altta Developer settings
#    → Personal access tokens → Fine-grained tokens → Generate new token
#
#    - Token name:        dreamcar-migration
#    - Expiration:        7 days  (iş bitince kendiliğinden ölsün)
#    - Repository access: Only select repositories → dreamcar-game
#    - Permissions:       Repository permissions → Contents → Read and write
#
#    Generate token → çıkan yazıyı kopyala (bir daha gösterilmez)
#
# 2) Secret olarak ekle
#    Bu depo (mod) → Settings → Secrets and variables → Actions
#    → New repository secret
#
#    - Name:   GAME_REPO_TOKEN
#    - Secret: kopyaladığın token
#
# 3) Çalıştır
#    Bu depo → Actions → "Oyunu ayrı depoya taşı" → Run workflow
#
# 4) Bittikten sonra token'ı sil
#    Settings → Developer settings → Personal access tokens → Delete
#    (7 gün sonra zaten kendiliğinden geçersiz olur)
# ============================================================================
